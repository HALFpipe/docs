project:
  type: website

website:
  title: "HALFpipe"
  navbar: false

  sidebar:
    style: docked
    pinned: true
    search: true
    collapse-level: 1
    contents:
      - index.qmd
      - about.qmd
      - installation.qmd
      - section: "Manuals"
        contents:
          - text: "rsfMRI Manual (Old UI)"
            file: manual_old_ui.qmd
          - text: "Resting-State fMRI (New UI)"
            file: new_ui.qmd
      - quality-control.qmd
      - check_run.qmd
      - troubleshooting.qmd

  announcement: 
    icon: info-circle
    dismissable: true
    content: "**NEW RELEASE** - HALFpipe v1.3.0 is now available! Check out the [release notes](https://github.com/HALFpipe/HALFpipe/releases/tag/1.3.0) for more details."
    type: primary
    position: below-navbar

  repo-url: https://github.com/HALFpipe/docs
  repo-actions: [issue, source]
    
format:
  html:
    theme: cosmo
    toc: true
    page-navigation: true
    page-layout: full
    grid:
      sidebar-width: 300px