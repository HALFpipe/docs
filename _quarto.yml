project:
  type: website

website:
  title: "HALFpipe"
  navbar: false

  sidebar:
    style: floating
    pinned: true
    search: true
    collapse-level: 1
    contents:
      - index.qmd
      - about.qmd
      - installation.qmd
      - section: "Manuals"
        contents:
          - text: "Resting-state fMRI Manual - Terminal UI"
            file: manual_old_ui.qmd
          - text: "Resting-state fMRI Manual - Graphical UI"
            file: new_ui.qmd
      - section: "Quality control"
        href: quality-control.qmd
        contents:
          - text: "Overview"
            href: quality-control.qmd
          - text: "Before starting the QC"
            href: qc/before-starting.qmd
          - text: "Step 1: Open the summary report in the reports folder"
            href: qc/summary-report.qmd
          - text: "Step 2: Open the index.html page"
            href: qc/reports.qmd
          - section: "QC categories"
            contents:
              - text: "T1w skull stripping"
                href: qc/skull-stripping.qmd
              - text: "dT1w spatial normalisation"
                href: qc/t1w-normalisation.qmd
              - text: "EPI tSNR"
                href: qc/tsnr.qmd
              - text: "EPI confounds (carpet plot)"
                href: qc/confounds.qmd
              - text: "EPI ICA-based artefact removal"
                href: qc/ica.qmd
              - text: "EPI spatial normalisation"
                href: qc/epi-normalisation.qmd
          - text: "Step 2b: Rerun subjects (if needed)"
            href: qc/rerun.qmd
          - text: "Cheat Sheet"
            href: qc/cheat-sheet.qmd
      - check_run.qmd
      - wonkyconn_docs.qmd
      - text: "Group-level analysis: ENIGMA-AN"
        file: group-level.qmd
      - troubleshooting.qmd

  announcement: 
    icon: info-circle
    dismissable: true
    content: "**NEW RELEASE** - HALFpipe v1.3.2 is now available! Check out the [release notes](https://github.com/HALFpipe/HALFpipe/releases/tag/1.3.2) for more details."
    type: primary
    position: below-navbar

  repo-url: https://github.com/HALFpipe/HALFpipe
  repo-actions: [issue]
    
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    page-navigation: true
    grid:
      sidebar-width: 300px
      body-width : 1200px
